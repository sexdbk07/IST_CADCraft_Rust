name: CLI binary

# Builds cadcraft-cli (release, Linux x86-64) and publishes it on the `ci-bin` branch, so DWG
# round-trip checks can run on drawings that must not be uploaded to this public repository.
on:
  push:
    branches: [main, 'exp/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cli-binary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    # Ubuntu 24.04 (glibc 2.39), so the binary also runs on older Linux machines.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev \
            libfreetype-dev libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cli-release
      # Experiment branches named exp/acadrust-X.Y.Z try that acadrust release.
      - name: Try another acadrust (exp/acadrust-* branches)
        if: startsWith(github.ref_name, 'exp/acadrust-')
        run: |
          v="${GITHUB_REF_NAME#exp/acadrust-}"
          cargo update -p acadrust --precise "$v"
          grep -A3 'name = "acadrust"' Cargo.lock
      - name: cargo build --release -p cadcraft-cli
        env:
          CARGO_PROFILE_RELEASE_DEBUG: ${{ startsWith(github.ref_name, 'exp/profile') && 'line-tables-only' || '0' }}
          CARGO_PROFILE_RELEASE_STRIP: ${{ startsWith(github.ref_name, 'exp/profile') && 'none' || 'debuginfo' }}
        run: |
          if [[ "$GITHUB_REF_NAME" == exp/acadrust-* ]]; then cargo build --release -p cadcraft-cli; else cargo build --locked --release -p cadcraft-cli; fi
      - name: Publish on ci-bin
        run: |
          set -e
          mkdir -p /tmp/bin && cp target/release/cadcraft-cli /tmp/bin/
          if [[ "$GITHUB_REF_NAME" != exp/profile* ]]; then strip /tmp/bin/cadcraft-cli || true; fi
          cp Cargo.lock /tmp/bin/Cargo.lock
          cd /tmp/bin
          echo "${GITHUB_SHA}" > SOURCE_COMMIT
          branch=ci-bin
          if [[ "$GITHUB_REF_NAME" != main ]]; then branch="ci-bin-${GITHUB_REF_NAME//\//-}"; fi
          git init -q -b "$branch"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add cadcraft-cli SOURCE_COMMIT Cargo.lock
          git commit -q -m "cadcraft-cli for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
